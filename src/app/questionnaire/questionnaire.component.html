<div class="container" mt-4>
  <h2>Questionnaire</h2>

  <select (change)="loadQuestions($event.target.value)" class="form-control mb-3">
    <option value="9">General Knowledge</option>
    <option value="18">Computers</option>
    <option value="21">Sports</option>
  </select>

  <div *ngIf="loading">Loading questions...</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="questions.length > 0 && !submitted">

    <p>
      Question {{ currentQuestionIndex + 1 }}
      of {{ questions.length }}
    </p>

    <div class="card p-3">

      <h5>{{ questions[currentQuestionIndex].question }}</h5>

      <div *ngFor="let answer of questions[currentQuestionIndex].answers">
        <button class="btn btn-outline-primary mb-2" [class.active]="selectedAnswers[currentQuestionIndex] === answer"
          (click)="selectAnswer(currentQuestionIndex, answer)">

          {{ answer }}
        </button>
      </div>

    </div>

    <button class="btn btn-secondary mt-3" [disabled]="currentQuestionIndex === 0" (click)="previousQuestion()">
      Previous
    </button>

    <button *ngIf="currentQuestionIndex < questions.length - 1" class="btn btn-primary mt-3" (click)="nextQuestion()">
      Next
    </button>

    <button *ngIf="currentQuestionIndex === questions.length - 1" class="btn btn-success mt-3"
      (click)="submitAnswers()">
      Submit
    </button>

  </div>
  <div *ngIf="submitted" class="alert alert-info mt-3">
    You Scored {{ score }} out of {{ questions.length }}!
  </div>
  <button *ngIf="submitted" class="btn btn-primary mt-3" (click)="restartQuiz()">
    Try again</button><br />

</div>

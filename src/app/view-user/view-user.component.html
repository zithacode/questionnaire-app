
<div class="container">
    <app-reusable></app-reusable>
    <div class="w-50 p-5 mt-5 mx-auto bg-secondary text-white">
        <h2 class="text center m-4">View User</h2>
        <div>
            <p>Name : <b class="text-info">{{userDetails.name}}</b></p>
            <p>Username : <b class="text-info">{{userDetails.username}}</b></p>
            <p>Email : <b class="text-info">{{userDetails.email}}</b></p>
        </div>

        <button class="btn btn-success" (click)="onClose()">Close</button>
    </div>
</div>

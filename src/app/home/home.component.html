<div class="container py-5">

  <!-- Welcome section -->
  <div class="text-center mb-5">
    <h1 class="display-4 font-weight-bold">
      Welcome to QuizTime!
    </h1>

    <p class="lead text-muted">
      Test your knowledge, challenge yourself, and see how much you know.
    </p>
  </div>

  <!-- Quiz setup -->
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <h4 class="card-title text-center mb-4">
            Set Up Your Quiz
          </h4>

          <!-- Category -->
          <div class="form-group">
            <label for="category">Choose a category</label>

            <select
              id="category"
              class="form-control"
              [(ngModel)]="selectedCategory">

              <option [ngValue]="null">Any Category</option>
              <option [ngValue]="9">General Knowledge</option>
              <option [ngValue]="18">Computers</option>
              <option [ngValue]="21">Sports</option>

            </select>
          </div>

          <!-- Number of questions -->
          <div class="form-group">
            <label for="amount">Number of questions</label>

            <select
              id="amount"
              class="form-control"
              [(ngModel)]="questionAmount">

              <option [ngValue]="5">5 Questions</option>
              <option [ngValue]="10">10 Questions</option>
              <option [ngValue]="15">15 Questions</option>

            </select>
          </div>

          <!-- Difficulty -->
          <div class="form-group">
            <label for="difficulty">Difficulty</label>

            <select
              id="difficulty"
              class="form-control"
              [(ngModel)]="difficulty">

              <option value="any">Any Difficulty</option>
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>

            </select>
          </div>

          <button
            class="btn btn-primary btn-lg btn-block mt-4"
            (click)="startQuiz()">
            Start Quiz
          </button>

        </div>
      </div>

    </div>
  </div>

</div>
